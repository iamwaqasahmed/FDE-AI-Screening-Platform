# Team manifest. Chapter 07 replaces the work copy with this file.
# Leave the packet shell unchanged.
# The namespace is ns-team. The account flag refuses a root
# account. Readiness calls /v1/health. Cpu and memory limits are set.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-access-assistant
  namespace: ns-team
  labels:
    app: patient-access-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-access-assistant
  template:
    metadata:
      labels:
        app: patient-access-assistant
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: assistant
          image: patient-access-assistant:m01_l04
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
