# Dev namespace. Chat and the staff console are routes on one service.
# A live cluster deploy is a later day.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-access-assistant
  labels:
    app: patient-access-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-access-assistant
  template:
    metadata:
      labels:
        app: patient-access-assistant
    spec:
      containers:
        - name: assistant
          image: patient-access-assistant:m02_l01
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: patient-access-assistant
spec:
  selector:
    app: patient-access-assistant
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: patient-access-assistant
spec:
  rules:
    - http:
        paths:
          - path: /chat
            pathType: Prefix
            backend:
              service:
                name: patient-access-assistant
                port:
                  number: 80
          - path: /console
            pathType: Prefix
            backend:
              service:
                name: patient-access-assistant
                port:
                  number: 80
