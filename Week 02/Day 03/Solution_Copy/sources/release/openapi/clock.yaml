openapi: 3.0.3
info:
  title: clock
  version: "1"
paths:
  /clock:
    get:
      operationId: readClock
      responses:
        "200":
          description: The pinned case clock.
    put:
      operationId: pinClock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [at]
              properties:
                at:
                  type: string
      responses:
        "200":
          description: The clock is pinned at `at`.
