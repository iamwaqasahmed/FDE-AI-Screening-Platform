# Published service levels for the Hartland mock systems.
# availability is the monthly target excluding announced maintenance; p95_ms is per endpoint at the load profile below.
window: calendar month
systems:
  registry:
    availability: 0.995
    endpoints:
      GET /registry/people: {p95_ms: 800}
      GET /registry/people/{registry_no}: {p95_ms: 250}
  booking:
    availability: 0.999
    endpoints:
      GET /booking/appointments: {p95_ms: 600}
      GET /booking/appointments/{booking_id}: {p95_ms: 200}
      POST /booking/appointments/{appointment_id}/contact: {p95_ms: 400}
      GET /booking/events: {p95_ms: 500}
      GET /booking/receipts: {p95_ms: 500}
  letters:
    availability: 0.99
    endpoints:
      GET /letters/dispatches: {p95_ms: 700}
      GET /letters/events: {p95_ms: 700}
  ophthalmology:
    availability: 0.99
    endpoints:
      GET /ophthalmology/referrals: {p95_ms: 900}
      GET /ophthalmology/referrals/{mrn}: {p95_ms: 300}
  vendor:
    availability: 0.98
    endpoints:
      GET /vendor/scores: {p95_ms: 1200}
      GET /vendor/scores/{file_name}: {p95_ms: 400}
event_delivery:
  booking: {p95_lag_minutes: 240, duplicates: possible, ordering: by delivery time, not by occurrence}
  letters: {p95_lag_minutes: 240, duplicates: possible, ordering: by delivery time, not by occurrence}
load_profile:
  unit: requests per minute, all systems combined
  by_hour:
    "00-06": 4
    "06-08": 25
    "08-10": 140
    "10-12": 120
    "12-14": 90
    "14-17": 110
    "17-20": 45
    "20-24": 12
  season_multiplier:
    jan: 1.25
    feb: 1.15
    mar: 1.1
    apr: 1.0
    may: 0.95
    jun: 0.9
    jul: 0.8
    aug: 0.75
    sep: 1.05
    oct: 1.15
    nov: 1.2
    dec: 0.85
