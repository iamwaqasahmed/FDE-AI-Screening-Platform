apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-access-assistant
  labels:
    app: patient-access-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-access-assistant
  template:
    metadata:
      labels:
        app: patient-access-assistant
    spec:
      containers:
        - name: assistant
          image: patient-access-assistant:day4
          ports:
            - containerPort: 8080
