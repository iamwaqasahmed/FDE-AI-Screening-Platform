feed: registry_file
system: registry
zone: ministry
grain: one person on the register at the extract date
keys:
  - REGISTRY_NO
  - LOCAL_PID
columns:
  - name: REGISTERED_SITE
    meaning: home clinic, renamed from HOME_CLINIC
dates:
  dob: ISO
known_defects:
  - registry numbers are reissued
owner: records manager
consumers:
  - warehouse
fails_when:
  - a required column is missing
  - a date does not parse
  - a row is dropped silently
