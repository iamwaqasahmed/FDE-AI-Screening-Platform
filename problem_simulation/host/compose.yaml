services:
  mocks:
    image: python:3.12-slim
    working_dir: /opt/alwaha
    volumes:
      - ..:/opt/alwaha
    command: ["python", "-m", "alwaha.serve", "--profile", "small", "--port", "8080"]
    ports:
      - "8080:8080"
  assistant:
    image: python:3.12-slim
    working_dir: /opt/alwaha
    volumes:
      - ..:/opt/alwaha
    command: ["python", "-m", "reference.server", "--port", "8081"]
    ports:
      - "8081:8081"
    depends_on:
      - mocks
