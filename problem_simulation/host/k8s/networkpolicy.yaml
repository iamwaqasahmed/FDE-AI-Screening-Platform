apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hospital-closed
  namespace: zone-hospital
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              alwaha/zone: facilitator
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: private-from-facilitator
  namespace: zone-private
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              alwaha/zone: facilitator
        - namespaceSelector:
            matchLabels:
              alwaha/zone: zone-private
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: public-zone-empty
  namespace: facilitator
spec:
  podSelector:
    matchLabels:
      alwaha/role: gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
